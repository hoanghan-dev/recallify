<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Loop Accent Gradient (Electric Sky to Soft Indigo) -->
    <linearGradient id="rec-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Kick Gradient (Cyan to Coral/White) -->
    <linearGradient id="rec-kick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <!-- Spark Gold/Amber Gradient -->
    <linearGradient id="rec-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="rec-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>

    <filter id="rec-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Squircle Canvas -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#rec-bg)" filter="url(#rec-shadow)" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- 2. Dual Flashcard Flip Overlap (Visualizing Active Recall & Spaced Repetition) -->
  <!-- Back Card (Subtle Angled Card Silhouette) -->
  <rect x="22" y="10" width="26" height="20" rx="5" fill="#FFFFFF" fill-opacity="0.12" transform="rotate(7 35 20)" />

  <!-- 3. Stylized "R" Monogram (Ribbon Loop + Pillar + Forward Kick) -->
  <!-- Left Pillar of "R" -->
  <rect x="15" y="15" width="7" height="34" rx="3.5" fill="#FFFFFF" />

  <!-- Upper Loop of "R" (Folding Flashcard Arch) -->
  <path
    d="M18.5 15 H34 C41.1797 15 47 20.1487 47 26.5 C47 32.8513 41.1797 38 34 38 H18.5 V31 H33.5 C36.8137 31 39.5 28.9853 39.5 26.5 C39.5 24.0147 36.8137 22 33.5 22 H18.5 V15 Z"
    fill="url(#rec-loop)"
  />

  <!-- Dynamic Kick of "R" (Shooting forward like an arrow of progress) -->
  <path
    d="M27.5 32.5 L40.5 47.2 C41.6 48.4 43.4 48.6 44.7 47.6 C46 46.5 46.2 44.7 45.1 43.5 L33.2 30 C32 28.6 29.8 28.5 28.3 29.6 C27.5 30.2 27.2 31.4 27.5 32.5 Z"
    fill="url(#rec-kick)"
  />

  <!-- 4. Epiphany Recall Spark (4-Point Diamond Star at upper right) -->
  <g transform="translate(47, 12)" filter="url(#rec-glow)">
    <path
      d="M0 -6 C0.3 -2 2 -0.3 6 0 C2 0.3 0.3 2 0 6 C-0.3 2 -2 0.3 -6 0 C-2 -0.3 -0.3 -2 0 -6 Z"
      fill="url(#rec-spark)"
    />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>
</svg>

